[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "munshi"
version = "0.1.0"
description = "GST ITC reconciliation agent that learns from how a CA firm resolves mismatches, using Hindsight memory."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# Direct dependencies only, with compatible ranges. Exact versions live in the
# lock files (requirements*.lock), generated by pip-tools — see README.
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    # Must match the hindsight-api server version (requirements-hindsight.lock).
    "hindsight-client==0.10.1",
    # Groq speaks the OpenAI API; used only in backend/app/llm.py.
    "openai>=3.19,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # Multipart form parsing for the upload endpoint.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # FastAPI's TestClient.
    "httpx>=0.27,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "evals"]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
markers = [
    "hindsight: needs a running Hindsight server (skipped when unreachable)",
    "groq: calls the Groq API (skipped without GROQ_API_KEY)",
]
filterwarnings = ["error"]

# --- ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["specs"]  # code snippets in the specs are illustrative, not source

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "RUF",      # ruff-specific
    "PTH",      # use pathlib
    "DTZ",      # timezone-aware datetimes
]
# The eval report is prose: en dashes for "not measured" and ranges, minus signs in ON − OFF.
allowed-confusables = ["–", "−"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["B011"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["backend", "evals"]
